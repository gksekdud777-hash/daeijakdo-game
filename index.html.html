const scenes=[
{chapter:'MISSION 01 · 현장 조사',title:'해안에서 발견한 암석',caption:'대이작도 · 현장 조사',story:'파도가 부딪히는 대이작도 해안. 너는 줄무늬가 있는 암석을 발견했어. “이 암석은 언제 만들어졌을까?” 현장에서 색과 무늬를 기록했지만 아직 나이는 알 수 없어.',mission:'암석의 절대 연령을 알아내려면 어떤 행동이 가장 적절할까?',choices:['줄무늬가 선명하니 아주 오래된 암석이라고 단정한다.','암석 시료를 채취해 내부 광물과 동위원소를 분석한다.','바닷물의 온도를 측정해 나이를 구한다.'],answer:1,why:'맞아! 암석의 겉모습만으로 절대 연령을 확정할 수 없어. 분석할 시료가 필요해.',art:'coast'},
{chapter:'MISSION 02 · 광물 탐색',title:'암석 속 작은 시간의 열쇠',caption:'실험실 · 지르콘 발견',story:'암석을 잘게 부수어 광물들을 분리했어. 현미경으로 보니 아주 작은 지르콘 결정이 보여. 지르콘은 형성될 때 우라늄을 포함할 수 있고, 그 기록을 오래 보존하기도 해.',mission:'지르콘이 절대 연령 측정에 유용한 가장 중요한 이유는?',choices:['지르콘은 모든 암석에 반드시 들어 있기 때문이다.','지르콘은 항상 육안으로 쉽게 보이기 때문이다.','지르콘에는 방사성 동위 원소가 들어갈 수 있고 그 기록이 보존되기 때문이다.'],answer:2,why:'정답! 지르콘은 우라늄을 포함할 수 있고, 초기 납이 적은 경우가 많아 연대측정에 유리해.',art:'zircon'},
{chapter:'MISSION 03 · 동위원소 분석',title:'우라늄이 남긴 단서',caption:'분석 장비 · 우라늄과 납',story:'연구 장비로 지르콘을 분석했어. 우라늄-235는 방사성 붕괴를 거쳐 납-207이 돼. 분석 결과를 단순화해 보니 처음 우라늄-235 양의 약 8.5%가 남아 있다는 모의 자료를 얻었어.',mission:'시간이 흐를수록 모원소인 우라늄-235의 양은 어떻게 변할까?',choices:['일정한 반감기에 따라 감소한다.','계속 증가한다.','언제나 같은 양으로 유지된다.'],answer:0,why:'맞아! 방사성 모원소의 양은 시간이 지날수록 감소하고 자원소가 생성돼.',stats:['모원소: U-235','자원소: Pb-207','모의 잔존 비율: 8.5%'],art:'lab'},
{chapter:'MISSION 04 · 반감기 해독',title:'원자핵 속 시계를 읽다',caption:'반감기 · 100% → 50% → 25% → 12.5%',story:'우라늄-235의 반감기는 약 7.04억 년이야. 반감기 1회 후 50%, 2회 후 25%, 3회 후 12.5%, 4회 후 6.25%가 남아. 현재 남은 비율은 약 8.5%야.',mission:'이 지르콘에는 반감기가 몇 회 정도 지났을까?',choices:['1~2회 사이','2~3회 사이','3~4회 사이'],answer:2,why:'정답! 8.5%는 12.5%(3회)와 6.25%(4회) 사이야.',stats:['1회: 50%','2회: 25%','3회: 12.5%','4회: 6.25%'],art:'graph'},
{chapter:'MISSION 05 · 연령 추정',title:'몇 억 년이 흘렀을까?',caption:'연구 노트 · 연령 계산',story:'3번의 반감기는 21.12억 년, 4번의 반감기는 28.16억 년이야. 우라늄-235가 약 8.5% 남았으므로 두 값 사이의 연령을 추정할 수 있어.',mission:'이 지르콘이 만들어진 시기는 약 몇 년 전일까?',choices:['약 7억 년','약 25억 년','약 70억 년'],answer:1,why:'정답! 약 3.56번의 반감기가 지난 것으로, 약 25억 년에 가까워. 이 계산은 수업용 모의 자료에 대한 추정이야.',stats:['반감기: 7.04억 년','잔존 비율: 약 8.5%'],art:'graph'},
{chapter:'MISSION 06 · 최종 보고',title:'우리가 밝혀낸 것은?',caption:'최종 보고 · 지구의 역사',story:'마침내 약 25억 년이라는 값을 얻었어. 하지만 과학자는 마지막 질문을 던져. “우리가 계산한 것은 무엇의 나이일까? 암석의 나이라고 곧바로 말해도 될까?”',mission:'가장 과학적으로 타당한 최종 보고는?',choices:['지르콘이 약 25억 년 전에 만들어졌다는 것을 알아냈다. 암석이 만들어진 시기는 다른 증거도 살펴봐야 한다.','지르콘이 25억 년이므로 이 암석과 해안의 모든 돌도 정확히 25억 년이다.','방사성 붕괴로는 어떤 연령도 추정할 수 없다.'],answer:0,why:'훌륭해! 광물의 절대 연령은 암석의 역사를 추론하는 중요한 증거지만, 광물과 암석의 형성 시기가 언제나 같은 것은 아니야.',art:'earth'}
];

let analysisClicks=0; const clicksNeeded=6;
function art(type){const idx={coast:0,zircon:1,lab:2,graph:step===4?4:3,earth:5}[type];return `<img src="${illustrationImages[idx]}" alt="탐험가 소녀의 ${type} 장면"/>`;}
function analyze(){if(step!==2||analysisClicks>=clicksNeeded)return;analysisClicks++;updateAnalyzer();if(analysisClicks===clicksNeeded)render();}
function updateAnalyzer(){let a=document.getElementById("analyzer");if(!a)return;let p=Math.round(analysisClicks/clicksNeeded*100);a.querySelector(".loading div").style.width=p+"%";a.querySelector(".pct").textContent=analysisClicks===clicksNeeded?"✨ 8.5% 발견!":"분석 중... "+p+"%";a.querySelector("button").textContent=analysisClicks===clicksNeeded?"분석 완료 ✓":"🖱️ 분석 버튼 누르기 ("+analysisClicks+"/"+clicksNeeded+")";a.querySelector("button").disabled=analysisClicks===clicksNeeded;if(analysisClicks===clicksNeeded)a.classList.add("sparkle");}
function render(){let s=scenes[step];$('progressText').textContent=(step+1)+' / 6';$('progressBar').style.width=((step+1)/6*100)+'%';$('art').innerHTML=art(s.art);if(step===2){$('art').innerHTML+=`<div class="analyzer" id="analyzer"><strong class="pct">분석 중... 0%</strong><div class="loading"><div></div></div><button type="button" onclick="analyze()">🖱️ 분석 버튼 누르기 (0/6)</button></div>`;updateAnalyzer();}$('sceneTitle').textContent=s.caption;$('chapter').textContent=s.chapter;$('title').textContent=s.title;$('story').textContent=step===2&&analysisClicks<clicksNeeded?s.story.replace('약 8.5%','■■■'):s.story;$('mission').textContent='🔎 연구 미션 · '+s.mission;$('stats').innerHTML=(s.stats||[]).filter(t=>step!==2||analysisClicks>=clicksNeeded||!t.includes('8.5%')).map(t=>'<span class="stat">'+t+'</span>').join('');$('choices').innerHTML='';s.choices.forEach((choice,i)=>{let b=document.createElement('button');b.textContent=(i+1)+'. '+choice;b.className=answers[step]===i?(i===s.answer?'correct':'wrong'):'';b.disabled=step===2&&analysisClicks<clicksNeeded;b.onclick=()=>{if(step===2&&analysisClicks<clicksNeeded)return;answers[step]=i;if(i===s.answer)solved[step]=true;render()};$('choices').append(b)});$('feedback').textContent=step===2&&analysisClicks<clicksNeeded?'왼쪽 모니터에서 분석 버튼을 여러 번 눌러 결과를 확인해 봐!':answers[step]<0?'정답을 선택하면 다음 단계로 진행할 수 있어.':answers[step]===s.answer?'✓ '+s.why:'다시 생각해 보자! 교과서의 핵심 개념과 자료를 살펴봐.';$('next').disabled=!solved[step];$('next').textContent=step===5?'연구 완료 · 결과 확인 ✓':'다음 단계 →';$('back').disabled=step===0}
$('next').onclick=()=>{if(step<5){step++;render()}else{document.querySelector('.panel').innerHTML='<div class="chapter">MISSION COMPLETE</div><h2>🎉 연구 성공!</h2><p class="story">대이작도 암석을 조사하며 지르콘의 연령을 추정했어. 과학자가 하는 일은 숫자를 계산하는 데서 끝나지 않아. <b>그 숫자가 무엇을 뜻하는지 증거를 바탕으로 해석하는 것</b>까지가 탐구야.</p><div class="report"><b>최종 연구 보고서</b><p>분석 광물: 지르콘</p><p>방법: 방사성 동위 원소의 반감기 이용</p><p>모의 분석 결과: U-235 잔존 비율 약 8.5%</p><p>지르콘이 만들어진 시기: 약 25억 년</p><p>주의: 암석의 형성 연령은 추가 지질학적 해석이 필요함</p></div><button class="next" onclick="location.reload()">처음부터 다시 플레이 ↻</button>';}};$('back').onclick=()=>{if(step>0){step--;render()}};$('restart').onclick=()=>location.reload();render();
</script></body></html>
